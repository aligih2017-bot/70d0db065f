  function ladeZustand() {
    try {
      var roh = localStorage.getItem(SPEICHER_KEY);
      if (roh) return JSON.parse(roh);
    } catch (e) {}
    return { teamname: "", namen: "", regelnAkzeptiert: false, startNummer: null, start: null, ende: null, station: 0, quizOk: [], fotos: [], hinweisGenutzt: [], sliderStrafen: [], uebersprungen: [] };

  function speichereZustand() {
    try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(zustand)); } catch (e) {}
    sendePraesenz();
  }
  var zustand = ladeZustand();
  var sortZustand = {};

  var LEHRKRAFT_MODUS = /(^|[?&])lehrkraft=1(&|$)/.test(location.search);

    ? window.claude.use("room").then(function(r) { raum = r; return r; }).catch(function() { return null; })
    : Promise.resolve(null);
  raumBereit.then(function() { sendePraesenz(); });

  function sendePraesenz() {
    if (!raum || !zustand.start) return;
    try {
      raum.presence({
        team: zustand.teamname || "Unbenanntes Team",
        namen: zustand.namen || "",
        startNummer: zustand.startNummer,
        quizOk: zustand.quizOk,

        fertig: !!zustand.ende

  var ROTIERBAR = [0, 1, 2, 3, 4];
  var FIX_ENDE = [5, 6, 7];
  function route() {
    var n = ((zustand.startNummer || 1) - 1) % ROTIERBAR.length;
    return ROTIERBAR.slice(n).concat(ROTIERBAR.slice(0, n)).concat(FIX_ENDE);
  }

  var app = document.getElementById("app");

  function formatZeit(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var rest = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (rest < 10 ? "0" : "") + rest;
  }

  function gesammelterCode(bisZuIndex) {
    var lettered = [];
    STATIONEN.forEach(function(s, idx) {
      if (s.buchstabe) lettered.push({ idx: idx, s: s });
    });
    lettered.sort(function(a, b) { return a.s.codePos - b.s.codePos; });
    var buchstaben = [];
    lettered.forEach(function(x) {
      if (zustand.quizOk[x.idx]) buchstaben.push(x.s.buchstabe);
      else if (bisZuIndex !== undefined) buchstaben.push("_");
    });
    return buchstaben.join(bisZuIndex !== undefined ? " " : "");
  }

  function fotoIstVollstaendig(s, idx) {
    if (s.fotoAnzahl > 1) {
      var arr = zustand.fotos[idx];
      return Array.isArray(arr) && arr.length === s.fotoAnzahl && arr.every(function(f) { return !!f; });
    }
    return !!zustand.fotos[idx];
  }

  function berechneBasisPunkte() {
    var punkte = 0;
    STATIONEN.forEach(function(s, idx) {
      if (zustand.quizOk[idx]) punkte += 10;
      if (fotoIstVollstaendig(s, idx)) punkte += 5;
    });
    var hinweisAnzahl = zustand.hinweisGenutzt.filter(function(h) { return h; }).length;
    punkte -= hinweisAnzahl * 3;
    var strafenAnzahl = 0;
    (zustand.sliderStrafen || []).forEach(function(obj) {
      if (!obj) return;
      Object.keys(obj).forEach(function(k) { if (obj[k]) strafenAnzahl++; });
    });
    punkte -= strafenAnzahl;
    var uebersprungenAnzahl = (zustand.uebersprungen || []).filter(function(u) { return u; }).length;
    punkte -= uebersprungenAnzahl * 10;
    return punkte;
  }

  function berechneVerspaetungMinuten() {
    if (!zustand.ende) return 0;
    return Math.max(0, Math.ceil(((zustand.ende - zustand.start) - SPIELZEIT_MS) / 60000));
  }

  function berechneVerspaetungsstrafe() {
    var min = berechneVerspaetungMinuten();
    if (min > 20) return 50;
    if (min > 10) return 20;
    return min;
  }

  function berechnePunkte() {
    return berechneBasisPunkte() - berechneVerspaetungsstrafe();
  }

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    var dp = [], i, j;
    for (i = 0; i <= m; i++) dp[i] = [i];
    for (j = 0; j <= n; j++) dp[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  function istTippfehler(wert, akzeptiert) {
    if (!wert) return false;
    return akzeptiert.some(function(a) {
      var an = a.replace(/[\s-]/g, "");
      if (!/[a-zäöüß]/i.test(an)) return false;
      var dist = levenshtein(wert, an);
      return dist > 0 && dist <= 2 && dist < an.length;
    });
  }

  function scrollSeiteNachOben() {
    requestAnimationFrame(function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      app.scrollTop = 0;
      if (app.scrollIntoView) app.scrollIntoView({ block: "start", inline: "nearest" });
      [60, 150, 350].forEach(function(verzoegerung) {
        setTimeout(function() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
          if (app.scrollIntoView) app.scrollIntoView({ block: "start", inline: "nearest" });
        }, verzoegerung);
      });
    });
  }

  function zeichneLehrerTabelle(peers) {

      var na = a.presence.startNummer, nb = b.presence.startNummer;

      if (na == null) return 1;
      if (nb == null) return -1;
      return na - nb;
    });

  function verkleinereFoto(file, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxW = 280;
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL("image/jpeg", 0.62));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function bindeAufgabe(s, i) {
    if (!s.aufgabeTyp || zustand.quizOk[i]) return;
    var feedback = document.getElementById("feedback");

    if (s.aufgabeTyp === "mc") {
      app.querySelectorAll(".mc-option").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          if (idx === s.richtig) { zustand.quizOk[i] = true; speichereZustand(); render(); }
          else {
            btn.classList.add("falsch");
            feedback.textContent = "Noch nicht ganz, lest die Infos vor Ort nochmal und versucht's erneut.";
            feedback.className = "feedback err";
            setTimeout(function() { btn.classList.remove("falsch"); }, 900);
          }
        });
      });
    }

    if (s.aufgabeTyp === "text") {
      var eingabe = document.getElementById("text-eingabe");
      var pruefen = document.getElementById("text-pruefen");
      function check() {
        var rohwert = eingabe.value.trim();
        sortZustand["text" + i] = rohwert;
        var ok;
        if (s.mindestAnzahl) {
          var teile = rohwert.split(/[,;\n]+/).map(function(t) { return t.trim().toLowerCase(); }).filter(function(t) { return t.length > 0; });
          var praefix = (s.praefix || "").toLowerCase();
          var treffer = teile.filter(function(t) { return t.indexOf(praefix) === 0; });
          var eindeutig = treffer.filter(function(t, idx) { return treffer.indexOf(t) === idx; });
          ok = eindeutig.length >= s.mindestAnzahl;
        } else {
          var wert = rohwert.toLowerCase().replace(/[\s-]/g, "");
          ok = s.akzeptiert.some(function(a) { return a.replace(/[\s-]/g, "") === wert; });
        }
        if (ok) { zustand.quizOk[i] = true; speichereZustand(); render(); }
        else {
          var wertNorm = rohwert.toLowerCase().replace(/[\s-]/g, "");
          feedback.textContent = (!s.mindestAnzahl && istTippfehler(wertNorm, s.akzeptiert))
            ? "Fast richtig – achte auf die Rechtschreibung."
            : (s.fehlerHinweis || "Noch nicht richtig, versucht's nochmal.");
          feedback.className = "feedback err";
        }
      }
      pruefen.addEventListener("click", check);
      eingabe.addEventListener("keydown", function(e) { if (e.key === "Enter") check(); });
    }

    if (s.aufgabeTyp === "slider") {
      var slider = document.getElementById("slider-input");
      var anzeige = document.getElementById("slider-anzeige");
      slider.addEventListener("input", function() {
        sortZustand["slider" + i] = parseInt(slider.value, 10);
        anzeige.textContent = slider.value + " " + s.einheit;
      });
      document.getElementById("slider-pruefen").addEventListener("click", function() {
        var wert = parseInt(slider.value, 10);
        var diff = wert - s.ziel;
        if (Math.abs(diff) <= s.toleranz) { zustand.quizOk[i] = true; speichereZustand(); render(); }
        else {
          feedback.textContent = diff > 0 ? "Zu hoch geschätzt, versucht's mit einer niedrigeren Zahl." : "Zu niedrig geschätzt, versucht's mit einer höheren Zahl.";
          feedback.className = "feedback hinweis";
        }
      });
    }

    if (s.aufgabeTyp === "sort") {
      var liste = document.getElementById("sort-liste");
      function bewegen(idx, richtung) {
        var arr = sortZustand["sort" + i];
        var ziel = idx + richtung;
        if (ziel < 0 || ziel >= arr.length) return;
        var t = arr[idx]; arr[idx] = arr[ziel]; arr[ziel] = t;
        render();
      }
      liste.querySelectorAll(".auf").forEach(function(btn) {
        btn.addEventListener("click", function() { bewegen(parseInt(btn.getAttribute("data-idx"), 10), -1); });
      });
      liste.querySelectorAll(".ab").forEach(function(btn) {
        btn.addEventListener("click", function() { bewegen(parseInt(btn.getAttribute("data-idx"), 10), 1); });
      });
      document.getElementById("sort-pruefen").addEventListener("click", function() {
        var arr = sortZustand["sort" + i];
        var ok = arr.length === s.richtigeReihenfolge.length && arr.every(function(id, idx) { return id === s.richtigeReihenfolge[idx]; });
        if (ok) { zustand.quizOk[i] = true; speichereZustand(); render(); }
        else { feedback.textContent = "Noch nicht die richtige Reihenfolge, denkt nochmal nach."; feedback.className = "feedback err"; }
      });
    }

    if (s.aufgabeTyp === "mehrfach") {
      if (!sortZustand["mehrfach" + i]) sortZustand["mehrfach" + i] = {};
      var subStatus = sortZustand["mehrfach" + i];
      if (!sortZustand["mehrfachEingabe" + i]) sortZustand["mehrfachEingabe" + i] = {};
      var textDraft = sortZustand["mehrfachEingabe" + i];
      if (!sortZustand["mehrfachSlider" + i]) sortZustand["mehrfachSlider" + i] = {};
      var sliderDraft = sortZustand["mehrfachSlider" + i];
      if (!zustand.sliderStrafen[i]) zustand.sliderStrafen[i] = {};

      app.querySelectorAll(".mehrfach-eingabe").forEach(function(inp) {
        var fi = parseInt(inp.getAttribute("data-fi"), 10);
        inp.addEventListener("input", function() { textDraft[fi] = inp.value; });
        inp.addEventListener("keydown", function(e) {
          if (e.key === "Enter") app.querySelector('.mehrfach-pruefen[data-fi="' + fi + '"]').click();
        });
      });
      app.querySelectorAll(".mehrfach-pruefen").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var fi = parseInt(btn.getAttribute("data-fi"), 10);
          var f = s.fragen[fi];
          var eingabe = app.querySelector('.mehrfach-eingabe[data-fi="' + fi + '"]');
          var wert = eingabe.value.trim().toLowerCase().replace(/[\s-]/g, "");
          var ok = f.akzeptiert.some(function(a) { return a.replace(/[\s-]/g, "") === wert; });
          if (ok) {
            subStatus[fi] = true;
            if (s.fragen.every(function(_, idx) { return subStatus[idx]; })) {
              zustand.quizOk[i] = true;
            }
            speichereZustand();
            render();
          } else {
            var fb = app.querySelector('.mehrfach-feedback[data-fi="' + fi + '"]');
            fb.textContent = istTippfehler(wert, f.akzeptiert)
              ? "Fast richtig – achte auf die Rechtschreibung."
              : (f.fehlerHinweis || "Noch nicht richtig, schaut nochmal genau hin.");
            fb.className = "feedback mehrfach-feedback err";
          }
        });
      });

      app.querySelectorAll(".mehrfach-slider-input").forEach(function(inp) {
        var fi = parseInt(inp.getAttribute("data-fi"), 10);
        inp.addEventListener("input", function() {
          sliderDraft[fi] = parseInt(inp.value, 10);
          var anzeige = document.getElementById("mehrfach-slider-anzeige-" + fi);
          if (anzeige) anzeige.textContent = inp.value + " " + s.fragen[fi].einheit;
        });
      });
      app.querySelectorAll(".mehrfach-slider-pruefen").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var fi = parseInt(btn.getAttribute("data-fi"), 10);
          var f = s.fragen[fi];
          var inp = app.querySelector('.mehrfach-slider-input[data-fi="' + fi + '"]');
          var wert = parseInt(inp.value, 10);
          var diff = wert - f.ziel;
          var abweichung = Math.abs(diff);
          var fb = app.querySelector('.mehrfach-feedback[data-fi="' + fi + '"]');
          var neueStrafe = f.strafToleranz != null && abweichung > f.strafToleranz && !zustand.sliderStrafen[i][fi];
          if (neueStrafe) zustand.sliderStrafen[i][fi] = true;
          if (abweichung <= f.toleranz) {
            subStatus[fi] = true;
            if (s.fragen.every(function(_, idx) { return subStatus[idx]; })) {
              zustand.quizOk[i] = true;
            }
            speichereZustand();
            render();
          } else {
            fb.textContent = (diff > 0 ? "Zu hoch geschätzt." : "Zu niedrig geschätzt.") +
              (f.strafToleranz != null && abweichung > f.strafToleranz ? " Das war mehr als " + f.strafToleranz + " " + f.einheit + " daneben (−1 Punkt)." : " Versucht's nochmal.");
            fb.className = "feedback mehrfach-feedback hinweis";
            speichereZustand();
          }
        });
      });
    }
  }

      return '<div class="punkt ' + cls + '"></div>';
    }).join("") + '</div>' +
      '<button class="karte-btn" id="karte-btn" aria-label="Karte anzeigen" title="Karte anzeigen">🗺️</button></div>';

    var kartenPos = KARTEN_POSITIONEN[idx] || { x: 50, y: 50 };
    var kartenOverlay =
      '<div class="karten-overlay" id="karten-overlay" hidden>' +
        '<div class="karten-box">' +
          '<button class="karten-schliessen" id="karten-schliessen">✕</button>' +
          '<div class="karten-bild-wrap">' +
            '<img class="karten-bild" src="bilder/karte.jpg" alt="Karte des Olympiaparks" onerror="this.style.display=\'none\'">' +
            '<div class="karten-pin" style="left:' + kartenPos.x + '%;top:' + kartenPos.y + '%;"></div>' +
          '</div>' +
          '<p class="karten-hinweis">Das rote Licht blinkt an eurer aktuellen Station: ' + escapeHtml(s.titel) + '</p>' +
        '</div>' +
      '</div>';

    var mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.maps);

    var mehrfachFoto = (s.fotoAnzahl || 1) > 1;
    var fotoHtml;
    if (mehrfachFoto) {
      var fotoArr = Array.isArray(zustand.fotos[idx]) ? zustand.fotos[idx] : new Array(s.fotoAnzahl).fill(null);
      var erledigtAnzahl = fotoArr.filter(function(f) { return !!f; }).length;
      fotoHtml =
        '<p class="aufgabe-label">Beweisfotos</p>' +
        '<p class="aufgabe-frage">' + s.foto + '</p>' +
        '<div class="foto-reihe">' +
        fotoArr.map(function(f, fIdx) {
          var label = (s.fotoLabels && s.fotoLabels[fIdx]) || (fIdx + 1);
          return '<div class="foto-slot' + (f ? ' hat-foto' : '') + '">' +
            '<input type="file" accept="image/*" capture="environment" class="foto-slot-input" data-idx="' + fIdx + '">' +
            (f ? '<img src="' + f + '" alt="">' : '<span class="foto-slot-label">' + escapeHtml(String(label)) + '</span>') +
            '</div>';
        }).join("") +
        '</div>' +
        '<p class="foto-reihe-hinweis">' + erledigtAnzahl + ' von ' + s.fotoAnzahl + ' Fotos aufgenommen. Tippt auf ein Feld, um dessen Foto aufzunehmen oder zu ersetzen.</p>';
    } else {
      var foto = zustand.fotos[idx];
      fotoHtml =
        '<p class="aufgabe-label">Beweisfoto</p>' +
        '<p class="aufgabe-frage">' + s.foto + '</p>' +
        '<div class="foto-bereich">' +
        '<input type="file" accept="image/*" capture="environment" id="foto-input">' +
        (foto
          ? '<div class="foto-vorschau"><img src="' + foto + '" alt=""><span class="info">✓ Foto aufgenommen</span><button id="foto-ersetzen">Ersetzen</button></div>'
          : '<button class="foto-btn" id="foto-btn">📷 Foto aufnehmen</button>'
        ) +
        '</div>';
    }

    app.innerHTML =
      kopf + fortschritt + kartenOverlay +
      '<button class="uebersicht-toggle" id="uebersicht-toggle">Alle Stationen anzeigen</button>' +
      '<div id="uebersicht-wrap" hidden></div>' +
      '<div class="karte' + (still ? ' still' : '') + '">' +
        '<img class="station-bild" src="' + s.bild + '" alt="" onerror="this.style.display=\'none\'">' +
        '<p class="station-kicker' + (still ? ' still' : '') + '">' + kickerText(i) + '</p>' +
        '<h2 class="station-titel">' + s.titel + '</h2>' +
        '<a class="maps-link" href="' + mapsUrl + '" target="_blank" rel="noopener">📍 In Google Maps öffnen</a>' +
        '<p class="station-kontext">' + s.kontext + '</p>' +
        (still ? '<p class="still-hinweis">' + s.stillHinweis + '</p>' : '') +
        renderAufgabe(s, idx) + renderHinweis(s, idx) + fotoHtml +
      '</div>' +
      '<div class="weiter-zeile">' +
        (i > 0 ? '<button class="zurueck" id="zurueck-btn">← Zurück</button>' : '') +
        '<button class="primaer weiter" id="weiter-btn" ' + (pruefeFreischaltung(idx) ? '' : 'disabled') + '>' + (i === STATIONEN.length - 1 ? "Zum Schatz" : "Weiter") + '</button>' +
        '<button class="ueberspringen-btn" id="ueberspringen-btn"><span>Station</span><span>überspringen</span></button>' +
      '</div>';

    startTimer();
    bindeAufgabe(s, idx);

    document.getElementById("karte-btn").addEventListener("click", function() {
      document.getElementById("karten-overlay").hidden = false;
    });
    document.getElementById("karten-schliessen").addEventListener("click", function() {
      document.getElementById("karten-overlay").hidden = true;
    });

    document.getElementById("uebersicht-toggle").addEventListener("click", function() {
      var wrap = document.getElementById("uebersicht-wrap");
      if (wrap.hidden) {
        wrap.innerHTML = '<ul class="uebersicht-liste">' + r.map(function(globalIdx, posIdx) {
          var st = STATIONEN[globalIdx];
          var fertig = posIdx < i;
          return '<li class="' + (fertig ? 'fertig' : '') + '"><span class="nr">' + (posIdx + 1) + '</span>' + (fertig ? "✓ " : "") + st.titel + '</li>';
        }).join("") + '</ul>';
        wrap.hidden = false;
      } else {
        wrap.hidden = true;
      }
    });

    if (mehrfachFoto) {
      app.querySelectorAll(".foto-slot-input").forEach(function(inp) {
        inp.addEventListener("change", function(e) {
          var fotoSlotIdx = parseInt(inp.getAttribute("data-idx"), 10);
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          verkleinereFoto(file, function(dataUrl) {
            if (!Array.isArray(zustand.fotos[idx])) zustand.fotos[idx] = new Array(s.fotoAnzahl).fill(null);
            zustand.fotos[idx][fotoSlotIdx] = dataUrl;
            speichereZustand();
            render();
          });
        });
      });
    } else {
      var fotoInput = document.getElementById("foto-input");
      function fotoUebernehmen(file) {
        if (!file) return;
        verkleinereFoto(file, function(dataUrl) {
          zustand.fotos[idx] = dataUrl;
          speichereZustand();
          render();
        });
      }
      fotoInput.addEventListener("change", function(e) { fotoUebernehmen(e.target.files && e.target.files[0]); });
      var fotoBtn = document.getElementById("foto-btn");
      if (fotoBtn) fotoBtn.addEventListener("click", function() { fotoInput.click(); });
      var fotoErsetzen = document.getElementById("foto-ersetzen");
      if (fotoErsetzen) fotoErsetzen.addEventListener("click", function() { fotoInput.click(); });
    }

    var weiterBtn = document.getElementById("weiter-btn");
    weiterBtn.addEventListener("click", function() {
      if (i === STATIONEN.length - 1) { zustand.ende = Date.now(); }
      else { zustand.station = i + 1; }
      speichereZustand();
      render();
      scrollSeiteNachOben();
    });

    var zurueckBtn = document.getElementById("zurueck-btn");
    if (zurueckBtn) {
      zurueckBtn.addEventListener("click", function() { zustand.station = i - 1; speichereZustand(); render(); });
    }

    var ueberspringenBtn = document.getElementById("ueberspringen-btn");
    if (ueberspringenBtn) {
      var uebersprungBestaetigen = false;
      ueberspringenBtn.addEventListener("click", function() {
        if (!uebersprungBestaetigen) {
          uebersprungBestaetigen = true;
          ueberspringenBtn.textContent = "Sicher? Kostet 10 Punkte – nochmal tippen";
          setTimeout(function() {
            uebersprungBestaetigen = false;
            ueberspringenBtn.textContent = "Station überspringen";
          }, 3000);
          return;
        }
        if (!zustand.uebersprungen[idx]) zustand.uebersprungen[idx] = true;
        if (i === STATIONEN.length - 1) { zustand.ende = Date.now(); }
        else { zustand.station = i + 1; }
        speichereZustand();
        render();
        scrollSeiteNachOben();
      });
    }

    var hinweisBtn = document.getElementById("hinweis-btn");
    if (hinweisBtn) {
      var hinweisBestaetigen = false;
      hinweisBtn.addEventListener("click", function() {
        if (!hinweisBestaetigen) {
          hinweisBestaetigen = true;
          hinweisBtn.textContent = "Sicher? Kostet 3 Punkte – nochmal tippen";
          setTimeout(function() {
            hinweisBestaetigen = false;
            hinweisBtn.textContent = "Hinweis anzeigen (−3 Punkte)";
          }, 3000);
          return;
        }
        zustand.hinweisGenutzt[idx] = true;
        speichereZustand();
        render();
      });
    }

    var ausstellenBtn = document.getElementById("ausstellen-btn");
    var ausstellenBestaetigen = false;
    ausstellenBtn.addEventListener("click", function() {
      if (!ausstellenBestaetigen) {
        ausstellenBestaetigen = true;
        ausstellenBtn.textContent = "Wirklich beenden?";
        setTimeout(function() { ausstellenBestaetigen = false; ausstellenBtn.textContent = "Ausstellen"; }, 3000);
        return;
      }
      zustand.ende = Date.now();
      speichereZustand();
      render();
    });
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    function tick() {
      var el = document.getElementById("timer-anzeige");
      if (!el) return;
      var rest = SPIELZEIT_MS - (Date.now() - zustand.start);
      if (rest >= 0) {
        el.textContent = formatZeit(rest);
        el.classList.remove("ueberzeit");
      } else {
        el.textContent = "−" + formatZeit(-rest);
        el.classList.add("ueberzeit");
      }
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  function renderFinale() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    var dauer = zustand.ende - zustand.start;
    var fotos = [];
    zustand.fotos.forEach(function(f) {
      if (Array.isArray(f)) { f.forEach(function(x) { if (x) fotos.push(x); }); }
      else if (f) { fotos.push(f); }
    });
    var code = gesammelterCode();
    var stationenGeloest = zustand.quizOk.filter(function(q) { return q; }).length;
    var fotosErledigt = STATIONEN.filter(function(s, idx) { return fotoIstVollstaendig(s, idx); }).length;
    var hinweiseGenutzt = zustand.hinweisGenutzt.filter(function(h) { return h; }).length;
    var uebersprungenAnzahl = (zustand.uebersprungen || []).filter(function(u) { return u; }).length;
    var verspaetungMin = berechneVerspaetungMinuten();
    var verspaetungStrafe = berechneVerspaetungsstrafe();
    var gesamtPunkte = berechnePunkte();
    app.innerHTML =
      '<img class="finale-bild" src="bilder/schatz.jpg" alt="" onerror="this.style.display=\'none\'">' +
      '<div class="text-karte"><h1 class="intro-titel" style="text-align:center;">Geschafft!</h1>' +
      '<p class="finale-zeit">' + gesamtPunkte + '</p>' +
      '<p class="finale-label">PUNKTE INSGESAMT</p></div>' +
      '<div class="punkte-breakdown">' +
        '<div class="punkte-zeile"><span>' + stationenGeloest + ' von ' + STATIONEN.length + ' Stationen gelöst</span><span>+' + (stationenGeloest * 10) + '</span></div>' +
        '<div class="punkte-zeile"><span>' + fotosErledigt + ' Beweisfotos</span><span>+' + (fotosErledigt * 5) + '</span></div>' +
        (hinweiseGenutzt ? '<div class="punkte-zeile"><span>' + hinweiseGenutzt + ' Hinweis(e) genutzt</span><span>−' + (hinweiseGenutzt * 3) + '</span></div>' : '') +
        (uebersprungenAnzahl ? '<div class="punkte-zeile"><span>' + uebersprungenAnzahl + ' Station(en) übersprungen</span><span>−' + (uebersprungenAnzahl * 10) + '</span></div>' : '') +
        (verspaetungStrafe ? '<div class="punkte-zeile"><span>Verspätung (' + verspaetungMin + ' Min.)</span><span>−' + verspaetungStrafe + '</span></div>' : '') +
        '<p class="finale-zeit-klein">Eure Zeit: ' + formatZeit(dauer) + ' · Ziel waren 120:00</p>' +
      '</div>' +
      '<div class="schatz-box">' +
        '<p class="kicker">Schatz-Code</p>' +
        '<p class="schatz-code">' + code + '</p>' +
        '<p class="hinweis">Zeigt diesen Code und eure Beweisfotos eurer Lehrkraft am <b>Café Coubertin</b> (Hans-Jochen-Vogel-Platz), um euren Schatz einzulösen.</p>' +
      '</div>' +
      '<div class="fotostrecke">' + fotos.map(function(f) { return '<img src="' + f + '" alt="">'; }).join("") + '</div>' +
      '<div class="team-liste-finale"><b>' + escapeHtml(zustand.teamname) + '</b><br>' + escapeHtml(zustand.namen) + '</div>' +
      '<button class="text-link" id="neustart-btn">Neue Runde starten</button>';

    var neustartBtn = document.getElementById("neustart-btn");
    var bestaetigen = false;
    neustartBtn.addEventListener("click", function() {
      if (!bestaetigen) {
        bestaetigen = true;
        neustartBtn.textContent = "Wirklich alles löschen? Nochmal tippen";
        setTimeout(function() { bestaetigen = false; neustartBtn.textContent = "Neue Runde starten"; }, 3000);
        return;
      }
      zustand = { teamname: "", namen: "", regelnAkzeptiert: false, startNummer: null, start: null, ende: null, station: 0, quizOk: [], fotos: [], hinweisGenutzt: [], sliderStrafen: [], uebersprungen: [] };
      sortZustand = {};
      speichereZustand();
      render();
    });
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  if (LEHRKRAFT_MODUS) { renderLehrkraftPasswort(); } else { render(); }
})();
</script>
